[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triton_quantization"
version = "0.1.0"
description = "Проект для квантизации весов LLM с использованием Triton"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "torch",
    "numpy"
]

[tool.ruff]
# Целевая версия Python
target-version = "py311"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = [
    "E501",
]

fixable = ["ALL"]
unfixable = []
